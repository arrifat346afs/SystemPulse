# System Monitor plugin: a bar widget that shows CPU/RAM usage and opens a detailed panel.

id = "noctalia/system-monitor"
name = "System Monitor"
version = "1.0.0"
plugin_api = 22
author = "noctalia"
license = "MIT"
dependencies = []
tags = ["system", "monitor", "performance"]
icon = "cpu"
description = "A bar widget that displays system stats and opens a detailed monitor panel."

[[widget]]
id = "sysmon"
entry = "systemmonitor.luau"

  [[widget.setting]]
  key = "show_cpu"
  type = "bool"
  label_key = "settings.show_cpu.label"
  default = true

  [[widget.setting]]
  key = "show_ram"
  type = "bool"
  label_key = "settings.show_ram.label"
  default = true

# Floating panel opened when the widget is clicked.
[[panel]]
id = "panel"
entry = "panel.luau"
width = 1920
height = 1080
placement = "floating"
position = "center"
open_near_click = true
