# System Monitor plugin: a bar widget that shows CPU/RAM usage and opens a detailed panel.

id = "noctalia/system-monitor"
name = "System Monitor"
version = "1.0.0"
plugin_api = 22
author = "noctalia"
license = "MIT"
dependencies = []
tags = ["system", "monitor", "performance"]
icon = "cpu"
description = "A bar widget that displays system stats and opens a detailed monitor panel."

[[widget]]
id = "sysmon"
entry = "systemmonitor.luau"

  [[widget.setting]]
  key = "show_cpu"
  type = "bool"
  label_key = "settings.show_cpu.label"
  default = true

  [[widget.setting]]
  key = "show_ram"
  type = "bool"
  label_key = "settings.show_ram.label"
  default = true

  [[widget.setting]]
  key = "show_gpu"
  type = "bool"
  label_key = "settings.show_gpu.label"
  default = false

  [[widget.setting]]
  key = "show_disk"
  type = "bool"
  label_key = "settings.show_disk.label"
  default = false

  [[widget.setting]]
  key = "show_network"
  type = "bool"
  label_key = "settings.show_network.label"
  default = false

# Control-center quick-toggle tile. Add it from Settings → Control Center shortcuts.
[[shortcut]]
id = "toggle"
entry = "shortcut.luau"

# Floating panel opened when the widget is clicked.
[[panel]]
id = "panel"
entry = "panel.luau"
width = 1080
height = 720
placement = "floating"
position = "center"
open_near_click = true
