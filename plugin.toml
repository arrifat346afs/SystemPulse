# Minimal plugin: a bar widget that opens a floating panel when clicked.

id = "noctalia/example"
name = "Example"
version = "1.3.1"
plugin_api = 22
author = "noctalia"
license = "MIT"
dependencies = []
tags = ["demo"]
icon = "puzzle"
description = "A widget that opens a floating panel when clicked."

[[widget]]
id = "hello"
entry = "hello.luau"

  [[widget.setting]]
  key = "label"
  type = "string"
  label_key = "settings.label.label"
  description_key = "settings.label.description"
  default = "Hello"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default = "puzzle"

  [[widget.setting]]
  key = "show_glyph"
  type = "bool"
  label_key = "settings.show_glyph.label"
  default = true

# Floating panel opened when the widget is clicked.
[[panel]]
id = "panel"
entry = "panel.luau"
width = 1920
height = 1080
placement = "floating"
position = "center"
open_near_click = true
